name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require tag
        run: test "$GITHUB_REF_TYPE" = tag
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify tag, main ancestry, version, notes and exact CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/guard.mjs release
      - run: npm ci
      - run: npm run build:cloudflare
      - name: Package application
        run: tar -czf "$RUNNER_TEMP/time-material-worker.tar.gz" dist package.json package-lock.json README.md CHANGELOG.md
      - name: Publish release and application archive idempotently
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: node scripts/release/publish.mjs
  production:
    needs: release
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

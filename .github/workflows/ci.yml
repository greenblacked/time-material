name: CI

on:
  push:
    branches: [dev, stage, main]
  pull_request:
    branches: [dev, stage, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Tests with coverage
        if: matrix.node == 22
        run: |
          set -euo pipefail
          mkdir -p coverage
          npm run test:coverage 2>&1 | tee coverage/summary.txt
      - name: Tests
        if: matrix.node != 22
        run: npm test
      - name: Coverage summary
        if: matrix.node == 22 && !cancelled()
        run: |
          if [ -f coverage/summary.txt ]; then
            {
              echo '### Node 22 test coverage'
              echo '```text'
              sed -n '/start of coverage report/,/end of coverage report/p' coverage/summary.txt
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.node == 22 && !cancelled()
        with:
          name: coverage
          path: coverage/summary.txt
          retention-days: 7

  build:
    name: build (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke-test built server
        run: node scripts/ci/smoke.mjs

  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Browsers and their system libraries ship in the image, so no per-run install.
    # Keep the tag equal to the locked `playwright` version; bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require image browsers to match the locked Playwright
        run: |
          locked="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          test "$locked" = "1.63.0" || { echo "playwright $locked is locked; update the container image tag and digest"; exit 1; }
      - name: Test built board on desktop and mobile, light and dark
        env:
          BROWSER_ENGINES: ${{ matrix.browser }}
          BROWSER_BASE_URL: http://127.0.0.1:4173
          BROWSER_ARTIFACT_DIR: artifacts/browser
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/time-material-preview.log"
          setsid npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >"$log_file" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill -- -"$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for _attempt in {1..60}; do
            if curl --fail --silent --max-time 2 "$BROWSER_BASE_URL/" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$log_file"
            exit 1
          fi
          if ! npm run test:browser; then
            cat "$log_file"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: artifacts/browser/
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Scan locked dependencies against OSV
        run: >-
          docker run --rm
          -v "$PWD/package-lock.json:/scan/package-lock.json:ro"
          ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
          scan source --lockfile=/scan/package-lock.json


  branch-name:
    name: branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node scripts/ci/branch-name.mjs
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/work:ro" -w /work rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Audit workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  worker:
    name: Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:cloudflare
      - run: npm run deploy:cloudflare:dry-run
      - run: node scripts/ci/worker-smoke.mjs

  ci-ok:
    name: CI
    if: always()
    needs:
      [lint, typecheck, test, build, worker, browser, security, branch-name, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node scripts/ci/gate.mjs
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          WORKER: ${{ needs.worker.result }}
          BROWSER: ${{ needs.browser.result }}
          SECURITY: ${{ needs.security.result }}
          BRANCH: ${{ needs.branch-name.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
          EVENT_NAME: ${{ github.event_name }}

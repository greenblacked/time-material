name: Cut release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version X.Y.Z already prepared on main
        required: true
        type: string
permissions: {}
concurrency:
  group: cut-release
  cancel-in-progress: false
jobs:
  cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Require main dispatch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Validate, create annotated tag and dispatch release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/cut.mjs

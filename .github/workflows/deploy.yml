name: Deploy Cloudflare

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [dev, stage, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  build:
    name: build and verify Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - id: target
        name: Select authorized deployment branch
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "environment=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$REF_TYPE" = branch ] || exit 1
          case "$REF_NAME" in
            main) echo "environment=production" >> "$GITHUB_OUTPUT" ;;
            stage) echo "environment=staging" >> "$GITHUB_OUTPUT" ;;
            *) echo 'Only main and stage can deploy'; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build:cloudflare
      - run: npm run deploy:cloudflare:dry-run
      - name: Smoke-test workerd and noindex preview bindings without credentials
        run: |
          preview_pid=''
          trap 'if [ -n "$preview_pid" ]; then kill -- -"$preview_pid" 2>/dev/null || true; fi' EXIT
          for mode in index noindex; do
            setsid npx --no-install wrangler dev --config dist/server/wrangler.json --local --port 8081 --var "ROBOTS:$mode" > "$RUNNER_TEMP/worker-$mode.log" 2>&1 &
            preview_pid=$!
            MODE="$mode" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:8081';
          const get = (path, timeout = 10000, options = {}) => fetch(base + path, { ...options, signal: AbortSignal.timeout(timeout) });
          const deadline = Date.now() + 60000;
          let response;
          while (Date.now() < deadline) {
            try { response = await get('/', 3000); if (response.ok) break; } catch {}
            await new Promise((resolve) => setTimeout(resolve, 500));
          }
          assert.ok(response?.ok, 'Worker SSR must respond');
          assert.ok(response.headers.get('x-worker-version'), 'Worker version metadata must reach responses');
          const noindex = process.env.MODE === 'noindex';
          assert.equal(response.headers.get('x-robots-tag'), noindex ? 'noindex, nofollow' : null);
          const html = await response.text();
          assert.match(html, /Time Material/);
          assert.match(html, /rel="manifest"/);
          const asset = html.match(/src="(\/assets\/[^"]+\.js)"/);
          assert.ok(asset?.[1].startsWith('/assets/'), 'SSR must reference a client bundle');
          assert.equal((await get(asset[1])).status, 200);
          const manifest = await get('/__Time/manifest.webmanifest');
          assert.equal(manifest.status, 200);
          assert.match(manifest.headers.get('content-type'), /manifest\+json/);
          assert.ok((await manifest.json()).name);
          assert.equal((await get('/?install=1&platform=ios', 10000, { headers: { accept: 'text/html' } })).status, 200);
          assert.equal((await get('/fonts/inter-400.woff2')).status, 200);
          const robots = await get('/robots.txt');
          assert.equal(robots.status, 200);
          assert.ok((await robots.text()).includes(noindex ? 'Disallow: /' : 'Allow: /'));
          JS
            kill -- -"$preview_pid"
            wait "$preview_pid" || true
            preview_pid=''
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-worker
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: publish prebuilt Worker
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ needs.build.outputs.environment }}
      url: ${{ needs.build.outputs.environment == 'production' && 'https://time.szolotov.com' || 'https://stage.time.szolotov.com' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Verify registry signatures before granting credentials
        run: npm audit signatures
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cloudflare-worker
          path: dist/
      # Credentials exist only during publication; no build/install script runs here.
      - name: Publish production or named stage preview
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ needs.build.outputs.environment }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo 'Configure repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          case "$TARGET" in
            production) npx --no-install wrangler deploy --no-autoconfig --no-install-skills --config dist/server/wrangler.json ;;
            staging) npx --no-install wrangler preview --no-install-skills --config dist/server/wrangler.json --name stage --ignore-base-config ;;
            *) exit 1 ;;
          esac
          if [ "$TARGET" = production ]; then
            node --input-type=module <<'JS'
            import fs from 'node:fs';
            const entries = fs.readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8').trim().split('\n').map(JSON.parse);
            const id = entries.filter((entry) => entry.type === 'deploy').at(-1)?.version_id;
            if (!/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/.test(id ?? '')) throw Error('Deployment is live but version ID is missing; manual verification and rollback may be required');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version_id=${id}\n`);
          JS
          else
            node --input-type=module <<'JS'
            import fs from 'node:fs';
            const entries = fs.readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8').trim().split('\n').map(JSON.parse);
            const preview = entries.filter((entry) => entry.type === 'preview').at(-1);
            const expected = 'https://stage.time.szolotov.com';
            if (!Array.isArray(preview?.preview_urls) || !preview.preview_urls.includes(expected)) {
              throw Error('Stage publication did not report https://stage.time.szolotov.com; verify first production custom-domain registration before reporting stage ready');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `preview_url=${expected}\n`);
          JS
          fi
      - name: Verify exact production version after publication
        id: smoke
        if: needs.build.outputs.environment == 'production'
        env:
          VERSION_ID: ${{ steps.publish.outputs.version_id }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'https://time.szolotov.com';
          const get = (path, timeout = 10000) => fetch(base + path, { signal: AbortSignal.timeout(timeout) });
          const deadline = Date.now() + 120000;
          let response;
          while (Date.now() < deadline) {
            try { response = await get('/', 3000); if (response.ok && response.headers.get('x-worker-version') === process.env.VERSION_ID) break; } catch {}
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          assert.equal(response?.status, 200);
          assert.equal(response.headers.get('x-worker-version'), process.env.VERSION_ID);
          const html = await response.text();
          assert.match(html, /Time Material/);
          const asset = html.match(/src="(\/assets\/[^"]+\.js)"/);
          assert.ok(asset?.[1].startsWith('/assets/'));
          assert.equal((await get(asset[1])).status, 200);
          const manifest = await get('/__Time/manifest.webmanifest');
          assert.equal(manifest.status, 200);
          assert.equal(manifest.headers.get('x-worker-version'), process.env.VERSION_ID);
          assert.ok((await manifest.json()).name);
          JS
      - name: Roll back only the failed production version
        if: failure() && steps.smoke.outcome == 'failure' && steps.publish.outputs.version_id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.publish.outputs.version_id }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://time.szolotov.com/', { signal: AbortSignal.timeout(10000) });
          if (response.headers.get('x-worker-version') !== process.env.VERSION_ID) throw Error('Current version is not the failed version: refusing automatic rollback; manual inspection required');
          JS
          npx --no-install wrangler rollback --yes --name time-material --message 'Production smoke failed'
          node --input-type=module <<'JS'
          const deadline = Date.now() + 60000;
          while (Date.now() < deadline) {
            try {
              const response = await fetch('https://time.szolotov.com/', { signal: AbortSignal.timeout(3000) });
              if (response.ok && response.headers.get('x-worker-version') !== process.env.VERSION_ID) process.exit(0);
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          throw Error('Rollback returned but the previous version is not confirmed answering; manual inspection required');
          JS
      - name: Stage verification requires Access authentication
        if: needs.build.outputs.environment == 'staging'
        run: echo 'Stage preview published. App behavior behind stage.time.szolotov.com Access remains unverified until checked with an authorized session; an Access login redirect is not an app smoke test.'

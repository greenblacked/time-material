name: Deploy Cloudflare

on:
  push:
    branches: [stage]
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-${{ github.ref_type == 'tag' && 'production' || 'staging' }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  build:
    name: build and verify Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - id: target
        name: Select authorized deployment branch
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$EVENT:$REF_TYPE:$REF_NAME" in
            push:branch:stage) echo "environment=staging" >> "$GITHUB_OUTPUT" ;;
            push:tag:v*|workflow_dispatch:tag:v*) echo "environment=production" >> "$GITHUB_OUTPUT" ;;
            *) echo 'Unauthorized deployment context'; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Require exact commit CI before building
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.target.outputs.environment }}
        run: |
          if [ "$TARGET" = production ]; then node scripts/release/guard.mjs release; else node scripts/release/guard.mjs stage; fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build:cloudflare
      - run: npm run deploy:cloudflare:dry-run
      - name: Smoke-test workerd and noindex preview bindings without credentials
        run: node scripts/ci/worker-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-worker
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: publish prebuilt Worker
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ needs.build.outputs.environment }}
      url: ${{ needs.build.outputs.environment == 'production' && 'https://time.szolotov.com' || 'https://stage.time.szolotov.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Verify registry signatures before granting credentials
        run: npm audit signatures
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cloudflare-worker
          path: dist/
      - name: Recheck exact commit CI and release before credentials
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ needs.build.outputs.environment }}
        run: |
          if [ "$TARGET" = production ]; then
            node scripts/release/guard.mjs release
            node scripts/release/published.mjs
          else
            node scripts/release/guard.mjs stage
          fi
      # Credentials exist only during publication; no build/install script runs here.
      - name: Publish production or named stage preview
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ needs.build.outputs.environment }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo 'Configure repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          case "$TARGET" in
            production) npx --no-install wrangler deploy --no-autoconfig --no-install-skills --config dist/server/wrangler.json ;;
            staging) npx --no-install wrangler preview --no-install-skills --config dist/server/wrangler.json --name stage --ignore-base-config ;;
            *) exit 1 ;;
          esac
          if [ "$TARGET" = production ]; then
            node --input-type=module <<'JS'
            import fs from 'node:fs';
            const entries = fs.readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8').trim().split('\n').map(JSON.parse);
            const id = entries.filter((entry) => entry.type === 'deploy').at(-1)?.version_id;
            if (!/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/.test(id ?? '')) throw Error('Deployment is live but version ID is missing; manual verification and rollback may be required');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version_id=${id}\n`);
          JS
          else
            node --input-type=module <<'JS'
            import fs from 'node:fs';
            const entries = fs.readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8').trim().split('\n').map(JSON.parse);
            const preview = entries.filter((entry) => entry.type === 'preview').at(-1);
            const expected = 'https://stage.time.szolotov.com';
            if (!Array.isArray(preview?.preview_urls) || !preview.preview_urls.includes(expected)) {
              throw Error('Stage publication did not report https://stage.time.szolotov.com; verify first production custom-domain registration before reporting stage ready');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `preview_url=${expected}\n`);
          JS
          fi
      # Reports whether the new version serves; it never blocks or undoes a publication.
      - name: Report exact production version after publication
        id: smoke
        if: needs.build.outputs.environment == 'production'
        continue-on-error: true
        env:
          VERSION_ID: ${{ steps.publish.outputs.version_id }}
        run: node scripts/release/production-smoke.mjs verify
      - name: Stage verification requires Access authentication
        if: needs.build.outputs.environment == 'staging'
        run: echo 'Stage preview published. App behavior behind stage.time.szolotov.com Access remains unverified until checked with an authorized session; an Access login redirect is not an app smoke test.'
